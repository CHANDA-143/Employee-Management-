<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            transition: 0.3s;
        }
        header {
            height: 88px;
            background: linear-gradient(90deg, #0d5cad, #1e73be);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo {
            font-size: 42px;
        }
        .logo-section h1 {
            font-size: 28px;
        }
        .dark-mode {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sun {
            font-size: 23px;
        }
        .switch {
            width: 52px;
            height: 28px;
            background: #2196f3;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
        }
        .switch::after {
            content: "";
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            right: 3px;
            transition: 0.3s;
        }
        .container {
            width: 95%;
            max-width: 1450px;
            margin: 28px auto;
        }
        .card {
            background: white;
            border: 1px solid #dbe3ec;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 25px;
            overflow: hidden;
        }
        .card-title {
            background: #edf6ff;
            padding: 18px 22px;

            font-size: 21px;
            font-weight: bold;
            color: #24364b;
        }
        .form-area {
            padding: 22px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 9px;
        }
        .required {
            color: red;
        }
        input,
        select {
            width: 100%;
            height: 46px;
            border: 1px solid #d5dce5;
            border-radius: 7px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            background: white;
        }
        input:focus,
        select:focus {
            border-color: #1683e8;
            box-shadow: 0 0 0 2px rgba(22, 131, 232, 0.1);
        }
        .add-btn {
            margin-top: 22px;
            background: #087de1;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 13px 30px;
            font-size: 16px;
            cursor: pointer;
        }
        .add-btn:hover {
            background: #056ac0;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 22px;
        }
        .stat-card {
            min-height: 105px;
            border-radius: 9px;
            border: 1px solid #dce5ee;
            display: flex;
            align-items: center;
            padding: 20px 32px;
        }
        .employee-stat {
            background: #eaf6ff;
        }
        .salary-stat {
            background: #eafff3;
        }
        .stat-icon {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 25px;
        }
        .employee-stat .stat-icon {
            background: #d7efff;
        }
        .salary-stat .stat-icon {
            background: #34bd68;
            color: white;
        }
        .stat-title {
            font-size: 16px;
            font-weight: bold;
            color: #246083;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 26px;
            font-weight: bold;
            color: #1f2937;
        }
        .table-card {
            padding: 20px;
        }
        .filters {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr 0.9fr;
            gap: 60px;
            margin-bottom: 20px;
        }
        .filter-group label {
            display: block;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .search-box {
            position: relative;
        }
        .search-icon {
            position: absolute;
            left: 15px;
            top: 13px;
            font-size: 19px;
            color: #66788a;
        }
        .search-box input {
            padding-left: 45px;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }
        thead {
            background: #eaf5ff;
        }
        th {
            text-align: left;
            padding: 16px 12px;
            font-size: 15px;
            color: #26394e;
        }
        td {
            padding: 14px 12px;
            border-bottom: 1px solid #dfe5eb;
            font-size: 15px;
        }
        tbody tr:hover {
            background: #f7fbff;
        }
        .edit-btn,
        .delete-btn {
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 7px;
        }
        .edit-btn {
            background: #087edc;
        }
        .delete-btn {
            background: #ef4048;
        }
        .edit-btn:hover {
            background: #0567b5;
        }
        .delete-btn:hover {
            background: #d92f37;
        }
        body.dark {
            background: #121820;
            color: #e8edf3;
        }
        body.dark .card,
        body.dark .table-card,
        body.dark input,
        body.dark select {
            background: #1d2733;
            color: white;
            border-color: #3b4856;
        }
        body.dark .card-title,
        body.dark thead {
            background: #263646;
            color: white;
        }
        body.dark td {
            border-color: #3b4856;
        }
        body.dark tbody tr:hover {
            background: #263646;
        }
        body.dark .stat-value {
            color: white;
        }
        body.dark .stat-title {
            color: #9ed5ff;
        }
        body.dark .employee-stat {
            background: #1d3345;
        }
        body.dark .salary-stat {
            background: #1c3a29;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <div class="logo">&#128101;</div>
            <h1>Employee Management System</h1>
        </div>
        <div class="dark-mode">
            <span class="sun">&#9788;</span>
            <div class="switch" onclick="toggleDarkMode()"></div>
            <span>Dark Mode</span>
        </div>
    </header>
    <main class="container">
        <div class="card">
            <div class="card-title">
                Add / Update Employee
            </div>
            <div class="form-area">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Employee Name <span class="required">&#42;</span></label>
                        <input type="text" id="name" placeholder="Enter employee name">
                    </div>
                    <div class="form-group">
                        <label>
                            Email <span class="required">&#42;</span>
                        </label>
                        <input type="email" id="email"placeholder="Enter email address">
                    </div>
                    <div class="form-group">
                        <label>
                            Department <span class="required">&#42;</span>
                        </label>
                        <select id="department">
                            <option value="">Select Department</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary <span class="required">&#42;</span></label>
                        <input type="number" id="salary" placeholder="Enter salary">
                    </div>
                </div>
                <button class="add-btn" onclick="saveEmployee()">
                    &#65291;Add Employee
                </button>
            </div>
        </div>
        <div class="stats">
            <div class="stat-card employee-stat">
                <div class="stat-icon">
                    &#128101;
                </div>
                <div>
                    <div class="stat-title">
                        Total Employees
                    </div>
                    <div class="stat-value" id="totalEmployees">
                        5
                    </div>
                </div>
            </div>
            <div class="stat-card salary-stat">
                <div class="stat-icon">
                    &#8377;
                </div>
                <div>
                    <div class="stat-title">
                        Total Salary
                    </div>
                    <div class="stat-value" id="totalSalary">
                        &#8377; 2,50,000
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="table-card">
                <div class="filters">
                    <div class="filter-group">
                        <label>Search</label>
                        <div class="search-box">
                            <span class="search-icon">
                                &#128269;
                            </span>
                            <input type="text" id="search" placeholder="Search by employee name..." oninput="displayEmployees()">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Department</label>
                        <select id="departmentFilter" onchange="displayEmployees()">
                            <option value="All">All</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Sort by Salary</label>
                        <select id="salarySort" onchange="displayEmployees()">
                            <option value="none">None</option>
                            <option value="low">Low to High</option>
                            <option value="high">High to Low</option>
                        </select>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Salary</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script>
        let employees = [
            {
                name: "Ravi Kumar",
                email: "ravi@gmail.com",
                department: "IT",
                salary: 50000
            },
            {
                name: "Anu Sharma",
                email: "anu@gmail.com",
                department: "HR",
                salary: 40000
            },
            {
                name: "Suresh Raju",
                email: "suresh@gmail.com",
                department: "Finance",
                salary: 60000
            },
            {
                name: "Priya Reddy",
                email: "priya@gmail.com",
                department: "Marketing",
                salary: 45000
            },
            {
                name: "Kiran Kumar",
                email: "kiran@gmail.com",
                department: "IT",
                salary: 55000
            }
        ];
        let editIndex = -1;

        function displayEmployees() {
            let search = document.getElementById("search").value.toLowerCase();
            let department = document.getElementById("departmentFilter").value;
            let sort = document.getElementById("salarySort").value;
            let filtered = employees.filter(function(employee) {
                let nameMatch = employee.name.toLowerCase().includes(search);
                let departmentMatch = department === "All" || employee.department === department;
                return nameMatch && departmentMatch;
            });

            if (sort === "low") {
                filtered.sort(function(a, b) {
                    return a.salary - b.salary;
                });
            }
            if (sort === "high") {
                filtered.sort(function(a, b) {
                    return b.salary - a.salary;
                });
            }

            let table =document.getElementById("employeeTable");
            table.innerHTML = "";
            filtered.forEach(function(employee) {

                let originalIndex = employees.indexOf(employee);
                let row = `
                    <tr>
                        <td> ${originalIndex + 1}</td>
                        <td>${employee.name}</td>
                        <td> ${employee.email}</td>
                        <td>${employee.department}</td>
                        <td>₹ ${employee.salary.toLocaleString("en-IN")}</td>
                        <td><button class="edit-btn" onclick="editEmployee(${originalIndex})">
                                ✎ Edit
                            </button>
                            <button class="delete-btn" onclick="deleteEmployee(${originalIndex})">
                                🗑 Delete
                            </button>
                        </td>
                    </tr>
                `;
                table.innerHTML += row;
            });
            updateStatistics();
        }
        function updateStatistics() {
            document.getElementById("totalEmployees").innerText =
                employees.length;
            let total = employees.reduce(
                function(sum, employee) {
                    return sum + Number(employee.salary);
                },
                0
            );
            document.getElementById("totalSalary").innerText = "₹ " + total.toLocaleString("en-IN");
        }

        function saveEmployee() {
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let department = document.getElementById("department").value;
            let salary = document.getElementById("salary").value;

            if (
                name === "" ||
                email === "" ||
                department === "" ||
                salary === ""
            ) {
                alert("Please fill all fields.");
                return;
            }
            let employee = {
                name: name,
                email: email,
                department: department,
                salary: Number(salary)
            };
            if (editIndex === -1) {
                employees.push(employee);
                alert("Employee added successfully!");
            } else {
                employees[editIndex] = employee;
                alert("Employee updated successfully!");
                editIndex = -1;
            }
            clearForm();
            displayEmployees();
        }

        function editEmployee(index) {
            let employee = employees[index];
            document.getElementById("name").value = employee.name;
            document.getElementById("email").value = employee.email;
            document.getElementById("department").value = employee.department;
            document.getElementById("salary").value =employee.salary;
            editIndex = index;
            document.querySelector(".add-btn").innerText = "✎ Update Employee";
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        function deleteEmployee(index) {
            let result = confirm("Are you sure you want to delete this employee?");
            if (result) {
                employees.splice(index, 1);
                displayEmployees();
            }
        }

        function clearForm() {
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("department").value = "";
            document.getElementById("salary").value = "";
            document.querySelector(".add-btn").innerText =
                "＋ Add Employee";
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark");
        }
        displayEmployees();
    </script>
</body>
</html>
